<h2>首页设计（图标导航版）</h2>
<p class="subtitle">图标化导航 + 聚焦中心展示</p>

<div class="mockup" style="background: #fafafa; padding: 30px; min-height: 400px;">
  <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 10px 0;">
    <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #e0e0e0, #c8c8c8); border-radius: 4px;"></div>
    <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #e5e5e5, #d0d0d0); border-radius: 4px;"></div>
    <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #e2e2e2, #d5d5d5); border-radius: 4px;"></div>
    <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #e8e8e8, #d8d8d8); border-radius: 4px;"></div>
    <div style="width: 14px; height: 14px; border: 1px solid #ddd; border-radius: 50%;"></div>
  </div>

  <div style="margin-top: 30px;">
    <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
      <div style="padding: 6px 20px; background: #333; border-radius: 20px; color: #fff; font-size: 11px;">风景</div>
      <div style="padding: 6px 20px; background: transparent; border: 1px solid #ddd; border-radius: 20px; color: #999; font-size: 11px;">人像</div>
      <div style="padding: 6px 20px; background: transparent; border: 1px solid #ddd; border-radius: 20px; color: #999; font-size: 11px;">城市</div>
      <div style="padding: 6px 20px; background: transparent; border: 1px solid #ddd; border-radius: 20px; color: #999; font-size: 11px;">街拍</div>
    </div>

    <div style="position: relative;">
      <div style="width: 60%; margin: 0 auto; aspect-ratio: 4/3; background: linear-gradient(135deg, #e8e8e8, #d0d0d0); border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.08);"></div>
      <div style="position: absolute; left: 5%; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 1px solid #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <span style="color: #999;">←</span>
      </div>
      <div style="position: absolute; right: 5%; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 1px solid #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <span style="color: #999;">→</span>
      </div>
    </div>

    <div style="margin-top: 30px; text-align: center;">
      <div style="display: inline-flex; gap: 8px;">
        <div style="width: 50px; height: 50px; background: #e5e5e5; border-radius: 2px;"></div>
        <div style="width: 50px; height: 50px; background: #e8e8e8; border-radius: 2px; border: 2px solid #333;"></div>
        <div style="width: 50px; height: 50px; background: #e5e5e5; border-radius: 2px;"></div>
        <div style="width: 50px; height: 50px; background: #e5e5e5; border-radius: 2px;"></div>
        <div style="width: 50px; height: 50px; background: #e5e5e5; border-radius: 2px;"></div>
      </div>
    </div>
  </div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px;">
  <div style="padding: 15px; background: #f5f5f5; border-radius: 8px;">
    <p class="label">图标导航（右上角）</p>
    <ul style="margin-top: 10px; font-size: 14px;">
      <li>32x32 带背景图片的图标</li>
      <li>无文字标签</li>
      <li>hover 时背景图片微放大</li>
      <li>点击跳转到对应页面</li>
    </ul>
  </div>
  <div style="padding: 15px; background: #f5f5f5; border-radius: 8px;">
    <p class="label">建议的图标内容</p>
    <ul style="margin-top: 10px; font-size: 14px;">
      <li>作品 → 相机/镜头图案</li>
      <li>项目 → 代码/窗口图案</li>
      <li>博客 → 书本/笔图案</li>
      <li>关于 → 人物/头像图案</li>
    </ul>
  </div>
</div>

<div style="margin-top: 30px; text-align: center;">
  <p style="font-size: 16px; color: #666;">请确认图标导航版设计</p>
</div>
