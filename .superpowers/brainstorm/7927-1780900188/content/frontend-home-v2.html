<h2>首页设计（简化版）</h2>
<p class="subtitle">极简 + 以内容为中心</p>

<div class="mockup" style="background: #fafafa; padding: 30px; margin: 20px 0;">

      <span style="color: #999; font-size: 12px;">作品</span>

<div style="margin: 20px 0;">

    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e5e5e5, #d5d5d5); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e0e0e0, #c8c8c8); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e2e2e2, #d2d2d2); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e6e6e6, #d6d6d6); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e3e3e3, #d3d3d3); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e7e7e7, #d7d7d7); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
    <div style="aspect-ratio: 1; background: linear-gradient(135deg, #e4e4e4, #d4d4d4); border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);"></div>
  </div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 30px;">
  <div style="padding: 15px; background: #f5f5f5; border-radius: 8px;">
    <p class="label">导航栏</p>
    <ul style="margin-top: 10px; font-size: 14px;">
      <li>固定在右上角</li>
      <li>字号 12px，颜色 #999</li>
      <li>最小化，不抢焦点</li>
      <li>hover 时颜色加深</li>
    </ul>
  </div>
  <div style="padding: 15px; background: #f5f5f5; border-radius: 8px;">
    <p class="label">首页内容</p>
    <ul style="margin-top: 10px; font-size: 14px;">
      <li>无标题文字，直接展示作品</li>
      <li>4列网格布局</li>
      <li>hover 上浮 + 阴影增强</li>
      <li>点击进入作品详情</li>
    </ul>
  </div>
</div>

<div style="margin-top: 30px; text-align: center;">
  <p style="font-size: 16px; color: #666;">请确认这个简化版首页设计</p>
