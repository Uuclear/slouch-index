<h2>色调选择</h2>
<p class="subtitle">哪种色调更符合你的摄影作品氛围？</p>

<div class="cards">
  <div class="card" data-choice="light" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="background: #fafafa; padding: 30px; min-height: 200px;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #e0e0e0, #c0c0c0); border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);"></div>
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #d0d0d0, #b0b0b0); border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);"></div>
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #c8c8c8, #a8a8a8); border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);"></div>
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #d8d8d8, #b8b8b8); border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.08);"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>浅色调</h3>
      <p>明亮、通透、干净的阅读体验</p>
    </div>
  </div>

  <div class="card" data-choice="dark" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup" style="background: #0a0a0a; padding: 30px; min-height: 200px;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #2a2a2a, #1a1a1a); border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);"></div>
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #3a3a3a, #2a2a2a); border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);"></div>
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #282828, #181818); border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);"></div>
          <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #383838, #282828); border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>深色调</h3>
      <p>沉浸、聚焦、让图片成为焦点</p>
    </div>
  </div>
</div>

<div class="section" style="margin-top: 30px; padding: 20px; background: #f8f8f8; border-radius: 8px;">
  <p class="label">交互效果预览</p>
  <p style="margin-top: 10px;">hover 效果：卡片轻微上浮 + 阴影增强 + 图片微放大</p>
  <p>点击效果：涟漪动画 + 平滑过渡到详情页</p>
</div>
